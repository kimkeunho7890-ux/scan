<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>실물 재고조사</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#047857">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="재고조사">
<style>
  :root{--bg:#0f1115;--card:#1a1d24;--line:#2a2f3a;--txt:#e8eaf0;--sub:#9aa3b2;--acc:#10b981;--blue:#3b82f6;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px}
  header{padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
  header h1{font-size:19px;margin:0;letter-spacing:-.3px}
  main{padding:12px 16px 60px;max-width:720px;margin:0 auto}
  #installBar{display:none;padding:10px 16px;background:#047857}
  #installBar button{width:100%;background:#fff;color:#047857;border:0;font-size:16px;font-weight:800;padding:12px;border-radius:10px;font-family:inherit}
  label.fl{display:block;font-size:13px;color:var(--sub);margin:0 0 6px;font-weight:600}
  input[type=search]{width:100%;background:#0f1115;color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:13px;font-size:17px;font-family:inherit}
  .ac{position:relative}
  #sugg{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:#111827;border:1px solid var(--line);border-radius:10px;max-height:300px;overflow:auto;z-index:20;box-shadow:0 10px 30px rgba(0,0,0,.5)}
  #sugg div{padding:11px 12px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:10px}
  #sugg div:last-child{border-bottom:0}
  #sugg div.on,#sugg div:hover{background:#1f2937}
  #sugg b{font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--acc);min-width:70px}
  #sugg .none{color:var(--sub);cursor:default}
  #picked{margin-top:8px;padding:11px 12px;border-radius:10px;background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.4);display:flex;justify-content:space-between;align-items:center;font-size:16px}
  #picked b{font-family:ui-monospace,Menlo,Consolas,monospace;margin-right:8px;color:var(--acc)}
  #picked a{color:var(--sub);font-size:13px;cursor:pointer}
  .info{font-size:12px;color:var(--sub);margin-top:8px;display:flex;justify-content:space-between;gap:8px}
  .info a{color:var(--blue);cursor:pointer;white-space:nowrap}
  .cam{position:relative;background:#000;border-radius:12px;overflow:hidden;aspect-ratio:4/3;width:100%;margin-top:12px}
  video{width:100%;height:100%;object-fit:cover;display:block}
  .box{position:absolute;left:5%;right:5%;top:25%;height:50%;border:2px solid rgba(255,255,255,.85);border-radius:8px;box-shadow:0 0 0 9999px rgba(0,0,0,.35);pointer-events:none;transition:border-color .15s}
  .box.hit{border-color:var(--ok)}
  .cam .camMsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;color:#ccc;font-size:14px;white-space:pre-line}
  .btns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
  button,.filebtn{background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:13px 4px;font-size:15px;font-weight:700;text-align:center;cursor:pointer;font-family:inherit}
  .filebtn input{display:none}
  button.cam-on{background:var(--blue);border-color:var(--blue);color:#fff}
  button.send{background:var(--acc);border-color:var(--acc);color:#04261b}
  button:disabled{opacity:.4}
  #status{font-size:12px;color:var(--sub);margin-top:6px;min-height:1em}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-top:12px}
  .card h2{font-size:14px;margin:0 0 4px;color:var(--sub);font-weight:600;display:flex;justify-content:space-between}
  #list .it{display:grid;grid-template-columns:26px 1fr auto 26px;gap:6px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line)}
  #list .it:last-child{border-bottom:0}
  #list .n{color:var(--sub);font-size:12px}
  #list .m{font-weight:700;word-break:break-all}
  #list .m.no{color:var(--warn);font-weight:600}
  #list .s{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;text-align:right}
  #list .s small{display:block;font-size:10px;color:var(--sub)}
  .ver{text-align:center;font-size:11px;color:#555;margin-top:18px}
  #list .x{background:none;border:0;color:var(--bad);font-size:20px;padding:0;line-height:1}
  #list .it.new{animation:flash 1s}
  #list .it.dup{animation:dupflash 1.2s}
  @keyframes dupflash{from{background:rgba(239,68,68,.35)}to{background:transparent}}
  #dupMsg{color:var(--bad);font-weight:700;font-size:15px;min-height:22px;margin-top:10px;transition:opacity .3s}
  #dupMsg.off{opacity:0}
  @keyframes flash{from{background:rgba(16,185,129,.35)}to{background:transparent}}
  .empty{color:#555;padding:10px 0}
  .hidden{display:none!important}
  /* 진입 화면 (로그인처럼) */
  #entryView{max-width:400px;margin:0 auto;padding:56px 20px 40px}
  #entryView .logo{width:72px;height:72px;border-radius:18px;display:block;margin:0 auto 14px}
  #entryView h1{text-align:center;font-size:26px;margin:0 0 6px;letter-spacing:-.5px}
  #entryView .sub{text-align:center;color:var(--sub);font-size:13px;margin-bottom:26px}
  .chips{display:flex;gap:8px;justify-content:center;margin-bottom:16px}
  .chip{border-radius:999px;padding:10px 22px;font-size:15px;font-weight:700;background:transparent;border:1.5px solid var(--line);color:var(--sub)}
  .chip.on{background:var(--acc);border-color:var(--acc);color:#04261b}
  .entryBox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
  .entryBox .go{width:100%;margin-top:10px;background:var(--acc);border-color:var(--acc);color:#04261b;font-size:16px}
  #recentPick{margin-top:14px;text-align:center;font-size:13px;color:var(--sub)}
  #recentPick a{color:var(--acc);cursor:pointer;font-weight:700}
  .who{display:flex;align-items:center;gap:8px;min-width:0}
  .who .k{font-size:11px;padding:2px 8px;border-radius:999px;background:rgba(16,185,129,.15);color:var(--acc);font-weight:700;white-space:nowrap}
  .who .k.staff{background:rgba(59,130,246,.15);color:var(--blue)}
  .who b{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .who code{color:var(--sub);font-size:12px}
  header a.chg{color:var(--sub);font-size:13px;cursor:pointer;white-space:nowrap;margin-left:8px}
  .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#111;border:1px solid var(--line);padding:10px 16px;border-radius:10px;font-size:14px;z-index:99;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
  .toast.show{opacity:1}
</style>
</head>
<body>
<div id="installBar"><button id="btnInstall">실물 재고조사 앱 설치 (바로가기)</button></div>
<!-- 진입 화면 -->
<div id="entryView">
  <img class="logo" src="icon-192.png" alt="">
  <h1>실물 재고조사</h1>
  <div class="sub">조사자를 선택하고 입력하세요</div>
  <div class="chips">
    <button class="chip on" id="chipStore">판매점</button>
    <button class="chip" id="chipStaff">영업사원</button>
  </div>
  <div class="entryBox" id="boxStore">
    <label class="fl" for="pcode">P코드 입력</label>
    <div class="ac">
      <input type="search" id="pcode" placeholder="P코드 또는 판매점명 2자 이상" autocomplete="off" autocapitalize="characters">
      <div id="sugg" class="hidden"></div>
    </div>
  </div>
  <div class="entryBox hidden" id="boxStaff">
    <label class="fl" for="staffName">영업사원 이름</label>
    <input type="search" id="staffName" placeholder="이름 입력" autocomplete="off">
    <button class="go" id="btnStaffGo">시작</button>
  </div>
  <div id="recentPick" class="hidden"></div>
  <div class="info" style="justify-content:center"><span id="dataInfo">판매점·재고 목록 불러오는 중...</span><a id="btnReload">새로고침</a></div>
  <div class="ver">버전 20261013j</div>
</div>

<!-- 조사 화면 -->
<div id="scanView" class="hidden">
<header>
  <div class="who"><span class="k" id="whoKind">판매점</span><b id="whoName"></b><code id="whoCode"></code></div>
  <a class="chg" id="btnChange">변경</a>
</header>
<main>
  <div class="cam" style="margin-top:0">
    <video id="video" playsinline muted autoplay></video>
    <div class="box" id="box"></div>
    <div class="camMsg" id="camMsg">[카메라]를 누르면 스캔을 시작합니다</div>
  </div>
  <div class="btns">
    <button id="btnCam">카메라</button>
    <label class="filebtn">사진파일<input type="file" id="file" accept="image/*"></label>
    <button class="send" id="btnSend" disabled>입력완료</button>
    <button id="btnClear">초기화</button>
  </div>
  <div id="status"></div>

  <div id="dupMsg" class="off"></div>
  <div class="card" style="margin-top:4px">
    <h2><span>인식 결과</span><span id="listCnt">0건</span></h2>
    <div id="list"><div class="empty">바코드를 비추면 모델명·일련번호가 한 줄씩 쌓입니다</div></div>
  </div>
</main>
</div>
<div class="toast" id="toast"></div>

<script src="config.js?v=20261013j"></script>
<script src="appwrite.js?v=20261013j"></script>
<script src="stock.js?v=20261013j"></script>
<script type="module">
const $ = id => document.getElementById(id);
const C = window.APP_CONFIG;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function toast(t, ms = 1800) { const el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('show'), ms); }
const setStatus = t => { $('status').textContent = t; };

// ================= 앱 설치 =================
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
let installed = false; try { installed = localStorage.getItem('survey_installed') === '1'; } catch (e) {}
let deferredPrompt = null;
const updateInstallBar = () => { $('installBar').style.display = (!isStandalone() && !installed && (deferredPrompt || isIOS)) ? 'block' : 'none'; };
addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; installed = false; updateInstallBar(); });
addEventListener('appinstalled', () => { installed = true; deferredPrompt = null; try { localStorage.setItem('survey_installed', '1'); } catch (e) {} updateInstallBar(); toast('설치 완료 — 홈 화면에서 실행하세요'); });
$('btnInstall').onclick = async () => {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    if (outcome === 'accepted') { installed = true; try { localStorage.setItem('survey_installed', '1'); } catch (e) {} }
    deferredPrompt = null; updateInstallBar();
  } else if (isIOS) toast('Safari 하단 [공유] → [홈 화면에 추가]를 누르세요', 4000);
};
updateInstallBar();

// ================= 데이터 (판매점 / 재고) =================
let stores = [];           // [{code, name}]
let stockIdx = null;       // 일련번호 → 모델명
let picked = null;         // {code, name}

function parseTable(text) { return Stock.parseCSV(String(text).replace(/^﻿/, '')); }
async function loadData() {
  $('dataInfo').textContent = '판매점·재고 목록 불러오는 중...';
  const msgs = [];
  try {
    const t = parseTable(await AW.fileText(C.publicBucketId, C.storesFileId));
    stores = t.slice(1).map(r => ({ code: String(r[0] || '').trim(), name: String(r[1] || '').trim() })).filter(s => s.code || s.name);
    msgs.push(`판매점 ${stores.length.toLocaleString()}곳`);
  } catch (e) { msgs.push('판매점 목록 없음'); }
  try {
    const rows = Stock.toStockRows(parseTable(await AW.fileText(C.publicBucketId, C.pubStockFileId)));
    stockIdx = Stock.buildIndex(rows);
    msgs.push(`재고 ${rows.length.toLocaleString()}건`);
  } catch (e) { stockIdx = null; msgs.push('재고리스트 없음'); }
  $('dataInfo').textContent = msgs.join(' · ');
  showRecentPick();
  relabel();
}
$('btnReload').onclick = loadData;

// ================= P코드 자동완성 =================
const inp = $('pcode'), sugg = $('sugg');
let suggList = [], suggOn = 0;
function showSugg() {
  const q = inp.value.trim().toUpperCase();
  if (q.length < 2) { sugg.classList.add('hidden'); return; }
  const starts = [], contains = [];
  for (const s of stores) {
    const c = s.code.toUpperCase(), n = s.name.toUpperCase();
    if (c.startsWith(q) || n.startsWith(q)) starts.push(s);
    else if (c.includes(q) || n.includes(q)) contains.push(s);
    if (starts.length >= 30) break;
  }
  suggList = starts.concat(contains).slice(0, 30); suggOn = 0;
  sugg.innerHTML = suggList.length
    ? suggList.map((s, i) => `<div data-i="${i}" class="${i === 0 ? 'on' : ''}"><b>${esc(s.code)}</b><span>${esc(s.name)}</span></div>`).join('')
    : `<div class="none">${stores.length ? '일치하는 판매점이 없습니다' : '판매점 목록이 아직 등록되지 않았습니다'}</div>`;
  sugg.classList.remove('hidden');
}
inp.addEventListener('input', showSugg);
inp.addEventListener('focus', showSugg);
inp.addEventListener('keydown', e => {
  if (sugg.classList.contains('hidden') || !suggList.length) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    suggOn = (suggOn + (e.key === 'ArrowDown' ? 1 : -1) + suggList.length) % suggList.length;
    sugg.querySelectorAll('div').forEach((d, i) => d.classList.toggle('on', i === suggOn));
  } else if (e.key === 'Enter') { e.preventDefault(); pick(suggList[suggOn]); }
});
sugg.addEventListener('mousedown', e => { const d = e.target.closest('div[data-i]'); if (d) { e.preventDefault(); pick(suggList[+d.dataset.i]); } });
document.addEventListener('click', e => { if (!e.target.closest('.ac')) sugg.classList.add('hidden'); });
// ================= 진입 / 전환 =================
function setChip(kind) {
  $('chipStore').classList.toggle('on', kind === 'store');
  $('chipStaff').classList.toggle('on', kind === 'staff');
  $('boxStore').classList.toggle('hidden', kind !== 'store');
  $('boxStaff').classList.toggle('hidden', kind !== 'staff');
  setTimeout(() => (kind === 'store' ? inp : $('staffName')).focus(), 50);
}
$('chipStore').onclick = () => setChip('store');
$('chipStaff').onclick = () => setChip('staff');

function enter(p) {   // p = {kind:'store'|'staff', code, name}
  picked = p;
  try { localStorage.setItem('survey_pick', JSON.stringify(p)); } catch (e) {}
  $('whoKind').textContent = p.kind === 'staff' ? '영업사원' : '판매점';
  $('whoKind').classList.toggle('staff', p.kind === 'staff');
  $('whoName').textContent = p.name;
  $('whoCode').textContent = p.kind === 'staff' ? '' : p.code;
  inp.value = ''; sugg.classList.add('hidden');
  $('entryView').classList.add('hidden'); $('scanView').classList.remove('hidden');
  setStatus(''); scrollTo(0, 0); updateSend();
}
function pick(s) { if (s) enter({ kind: 'store', code: s.code, name: s.name }); }
function staffGo() {
  const n = $('staffName').value.trim();
  if (n.length < 2) { toast('영업사원 이름을 2자 이상 입력하세요'); $('staffName').focus(); return; }
  enter({ kind: 'staff', code: '영업사원', name: n });
}
$('btnStaffGo').onclick = staffGo;
$('staffName').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); staffGo(); } });

function showRecentPick() {   // 최근 조사자 바로 이어하기
  let p = null; try { p = JSON.parse(localStorage.getItem('survey_pick') || 'null'); } catch (e) {}
  const el = $('recentPick');
  if (!p || !p.name) { el.classList.add('hidden'); return; }
  el.innerHTML = `최근: ${p.kind === 'staff' ? '영업사원 ' : esc(p.code) + ' '}${esc(p.name)} · <a id="btnResume">이어서 하기</a>` +
                 (list.length ? ` <span style="color:var(--warn)">(미전송 ${list.length}건)</span>` : '');
  el.classList.remove('hidden');
  $('btnResume').onclick = () => enter(p.kind ? p : { kind: 'store', ...p });
}
$('btnChange').onclick = () => {
  if (camWanted) $('btnCam').click();          // 카메라 끄기
  picked = null; updateSend();
  $('scanView').classList.add('hidden'); $('entryView').classList.remove('hidden');
  showRecentPick(); setChip('store');
};

// ================= 인식 결과 목록 =================
let list = [];   // [{model, serial, serialRaw, matched}]
try { list = JSON.parse(localStorage.getItem('survey_list') || '[]'); } catch (e) {}
const saveDraft = () => { try { localStorage.setItem('survey_list', JSON.stringify(list)); } catch (e) {} };
// 삼성 박스 바코드 = 라벨 인쇄 일련번호(12자리) + 검증문자 1자리 (예: CTLSM0107718+7, CT7BM1097614+N)
const samsungBase = t => t.length === 13 ? t.slice(0, -1) : t.replace(/[A-Z]+$/, '');
// 표시용: 인쇄 일련번호의 끝 숫자 7자리 (CTLSM01077187 → 0107718)
const serial7 = s => { const m = samsungBase(String(s)).match(/(\d{7})$/); return m ? m[1] : null; };

function lookupModel(cands) {
  if (!stockIdx) return { model: '', matched: false };
  const m = stockIdx.find(cands);
  return m.rows.length ? { model: m.rows.map(r => r.model).filter((v, i, a) => a.indexOf(v) === i).join(' / '), matched: true } : { model: '', matched: false };
}
// 바코드 묶음에서 일련번호만 추출
function serialsFrom(results) {
  const out = [];
  for (const b of results) {
    if (!b.isValid || !b.text) continue;
    const t = b.text.trim();
    const ap = t.match(/boxinfo\.apple\.com\/.*?\/21\/([A-Z0-9]+)/i);              // 아이폰 박스 QR
    if (ap) { out.push({ serial: ap[1].toUpperCase(), raw: ap[1].toUpperCase(), cands: [ap[1]] }); continue; }
    if (/^\d+$/.test(t) || /^89\d{30}$/.test(t)) continue;                          // IMEI·EID·EAN 제외
    if (/^S[A-Z0-9]{10}$|^S[A-Z0-9]{12}$/.test(t) && /[A-Z]/.test(t.slice(1))) {     // 아이폰 시리얼 바코드 (S+시리얼)
      out.push({ serial: t.slice(1), raw: t.slice(1), cands: [t.slice(1), t] }); continue;
    }
    // 스타일폴더(AT-M140L 등): ATM + 숫자 (예: ATM71301561626) → 뒤 6자리 561626
    const a6 = t.match(/^ATM\d{8,12}$/);
    if (a6) { const v = t.slice(-6); out.push({ serial: v, raw: t, cands: [v] }); continue; }
    // 삼성 박스 2D코드(DataMatrix): 영문 3자리 + 일련번호 숫자 7자리 + 검증문자 1자리
    // 예) AXP03995109 → 0399510, AYC0107718. → 0107718
    const dm = t.match(/^[A-Z]{3}(\d{7})[0-9A-Z.]?$/);
    if (dm) { out.push({ serial: dm[1], raw: t, cands: [dm[1]] }); continue; }
    if (/^[A-Z0-9]{10,16}$/.test(t) && /[A-Z]/.test(t) && /\d/.test(t)) {            // 삼성 등
      const s7 = serial7(t);
      out.push({ serial: s7 || t, raw: t, cands: [t, samsungBase(t), s7].filter(Boolean) });
    }
  }
  return out;
}
// 같은 박스가 계속 비칠 때 연속 경고가 뜨지 않도록: 방금 추가한 일련번호는 2.5초간 경고 제외, 경고는 같은 번호당 2초에 1번
const recentAdd = new Map(), recentWarn = new Map();
let dupTimer = null;
function showDup(x) {
  const el = $('dupMsg');
  el.textContent = `이미 입력된 재고입니다 · ${x.matched ? x.model : '재고 미등록'} ${x.serial}`;
  el.classList.remove('off');
  clearTimeout(dupTimer); dupTimer = setTimeout(() => el.classList.add('off'), 2500);
  const row = document.querySelector(`#list .it[data-s="${CSS.escape(x.serial)}"]`);
  if (row) { row.classList.remove('dup'); void row.offsetWidth; row.classList.add('dup'); }
  navigator.vibrate?.([40, 60, 40]); beep(600);
}
function addSerials(found) {
  let added = 0; const now = Date.now();
  for (const f of found) {
    const ex = list.find(x => x.serial === f.serial);
    if (ex) {
      if (now - (recentAdd.get(f.serial) || 0) < 2500) continue;     // 방금 찍은 박스
      if (now - (recentWarn.get(f.serial) || 0) < 2000) continue;    // 경고 반복 방지
      recentWarn.set(f.serial, now); showDup(ex);
      continue;
    }
    const { model, matched } = lookupModel(f.cands);
    list.push({ model, serial: f.serial, serialRaw: f.raw, matched, _new: true });
    recentAdd.set(f.serial, now);
    added++;
  }
  if (added) {
    $('box').classList.add('hit'); setTimeout(() => $('box').classList.remove('hit'), 250);
    navigator.vibrate?.(70); beep();
    $('dupMsg').classList.add('off');
    saveDraft(); renderList();
  }
  return added;
}
function renderList() {
  const el = $('list');
  if (!list.length) el.innerHTML = '<div class="empty">바코드를 비추면 모델명·일련번호가 한 줄씩 쌓입니다</div>';
  else el.innerHTML = list.map((x, i) => `<div class="it${x._new ? ' new' : ''}" data-s="${esc(x.serial)}"><span class="n">${i + 1}</span>
      <span class="m${x.matched ? '' : ' no'}">${x.matched ? esc(x.model) : '재고 미등록'}</span>
      <span class="s">${esc(x.serial)}${x.serialRaw && x.serialRaw !== x.serial ? `<small>${esc(x.serialRaw)}</small>` : ''}</span><button class="x" data-i="${i}" aria-label="삭제">×</button></div>`).reverse().join('');
  list.forEach(x => delete x._new);
  el.querySelectorAll('.x').forEach(b => b.onclick = () => { list.splice(+b.dataset.i, 1); saveDraft(); renderList(); });
  $('listCnt').textContent = list.length + '건';
  updateSend();
}
function relabel() {   // 재고리스트가 늦게 로드된 경우 모델명 다시 채움
  let ch = false;
  for (const x of list) if (!x.matched) { const r = lookupModel([x.serialRaw, x.serial]); if (r.matched) { Object.assign(x, r); ch = true; } }
  if (ch) saveDraft(); renderList();
}
function updateSend() { $('btnSend').disabled = !(picked && list.length); }

let actx;
function beep(f = 1800) {
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = f; g.gain.value = 0.08;
    o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + 0.08); } catch (e) {}
}

// ================= 바코드 엔진 =================
const ZX = 'https://cdn.jsdelivr.net/npm/zxing-wasm@2.2.4/dist';
let readBarcodes = null;
const libReady = import(ZX + '/es/reader/index.js').then(m => {
  m.prepareZXingModule({ overrides: { locateFile: (p, prefix) => p.endsWith('.wasm') ? ZX + '/reader/' + p : prefix + p }, fireImmediately: true });
  readBarcodes = m.readBarcodes; return true;
}).catch(e => { setStatus('바코드 엔진 로딩 실패: ' + e.message); return false; });
const READ_OPTS = { tryHarder: true, tryInvert: true, tryRotate: true, maxNumberOfSymbols: 20, formats: ['Code128', 'Code39', 'QRCode', 'DataMatrix'] };

// ================= 카메라 =================
const video = $('video'), box = $('box');
const canvas = document.createElement('canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
let stream = null, track = null, scanning = false, camToken = 0, camWanted = false;
const camMsg = t => { $('camMsg').textContent = t || ''; $('camMsg').classList.toggle('hidden', !t); };

async function startCam() {
  stopCam(false);
  const my = ++camToken;
  if (!navigator.mediaDevices?.getUserMedia) { camMsg('이 브라우저는 카메라를 지원하지 않습니다.\n(카카오톡 내장 브라우저라면 크롬/삼성인터넷으로 여세요)'); return; }
  camMsg('카메라 켜는 중...');
  const tries = [
    { audio: false, video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } } },
    { audio: false, video: { facingMode: 'environment' } },
    { audio: false, video: true }
  ];
  let s = null, lastErr = null;
  for (const c of tries) {
    try { s = await navigator.mediaDevices.getUserMedia(c); break; }
    catch (e) { lastErr = e; if (e.name === 'NotAllowedError' || e.name === 'SecurityError') break; await sleep(400); }
  }
  if (my !== camToken) { s?.getTracks().forEach(t => t.stop()); return; }
  if (!s) {
    const n = lastErr?.name;
    camMsg(n === 'NotAllowedError' ? '카메라 권한이 차단되어 있습니다.\n주소창 왼쪽 아이콘 → 권한 → 카메라 허용 후\n[카메라]를 다시 누르세요.'
         : n === 'NotReadableError' ? '다른 앱이 카메라를 사용 중입니다.\n다른 앱을 닫고 [카메라]를 다시 누르세요.'
         : '카메라를 열 수 없습니다: ' + (n || lastErr?.message));
    camWanted = false; $('btnCam').classList.remove('cam-on'); $('btnCam').textContent = '카메라';
    return;
  }
  stream = s; track = s.getVideoTracks()[0];
  track.addEventListener('ended', () => { if (my === camToken) { stopCam(false); camMsg('카메라가 중지되었습니다.\n[카메라]를 다시 누르세요.'); } });
  video.srcObject = s;
  try { await video.play(); } catch (e) {}
  camMsg('');
  try { await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }); } catch (e) {}
  scanning = true; loop(my);
}
function stopCam(userAction = true) {
  camToken++; scanning = false;
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null; track = null;
  try { video.pause(); } catch (e) {}
  video.srcObject = null;
  if (userAction) { camMsg('[카메라]를 누르면 스캔을 시작합니다'); setStatus(''); }
}
$('btnCam').onclick = () => {
  camWanted = !camWanted;
  $('btnCam').classList.toggle('cam-on', camWanted);
  $('btnCam').textContent = camWanted ? '카메라 끄기' : '카메라';
  camWanted ? startCam() : stopCam();
};
document.addEventListener('visibilitychange', () => { if (document.hidden) stopCam(false); else if (camWanted) startCam(); });
addEventListener('pagehide', () => stopCam(false));

function grabBox() {
  const vw = video.videoWidth, vh = video.videoHeight; if (!vw) return null;
  const el = video.getBoundingClientRect(), bx = box.getBoundingClientRect();
  const k = Math.max(el.width / vw, el.height / vh);
  const ox = (el.width - vw * k) / 2, oy = (el.height - vh * k) / 2;
  const sx = Math.max(0, (bx.left - el.left - ox) / k), sy = Math.max(0, (bx.top - el.top - oy) / k);
  const sw = Math.min(vw - sx, bx.width / k), sh = Math.min(vh - sy, bx.height / k);
  if (sw < 10 || sh < 10) return null;
  canvas.width = Math.round(sw); canvas.height = Math.round(sh);
  ctx.drawImage(video, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
  return ctx.getImageData(0, 0, canvas.width, canvas.height);
}
async function loop(my) {
  if (!(await libReady)) return;
  while (scanning && my === camToken) {
    const img = grabBox();
    if (img) {
      try { const res = await readBarcodes(img, READ_OPTS); if (my === camToken) addSerials(serialsFrom(res)); }
      catch (e) { setStatus('인식 오류: ' + e.message); }
      if (scanning && my === camToken) setStatus(`스캔 중 · ${list.length}건`);
    }
    await sleep(120);
  }
}

// ================= 사진파일 =================
$('file').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  setStatus('사진 분석 중...');
  if (!(await libReady)) return;
  try {
    const bmp = await createImageBitmap(f, { imageOrientation: 'from-image' });
    const k = Math.min(1, 2400 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    const cx = c.getContext('2d', { willReadFrequently: true }); cx.drawImage(bmp, 0, 0, c.width, c.height);
    const n = addSerials(serialsFrom(await readBarcodes(cx.getImageData(0, 0, c.width, c.height), READ_OPTS)));
    setStatus(n ? `사진에서 ${n}건 추가` : ($('dupMsg').classList.contains('off') ? '사진에서 새 일련번호를 찾지 못했습니다' : ''));
  } catch (err) { setStatus('사진 분석 실패: ' + err.message); }
  e.target.value = '';
};

// ================= 입력완료 / 초기화 =================
$('btnSend').onclick = async () => {
  if (!picked) { toast('P코드를 먼저 선택하세요'); $('pcode').focus(); return; }
  if (!list.length) return;
  if (!confirm(`${picked.name} (${picked.code})\n${list.length}건을 전송할까요?`)) return;
  $('btnSend').disabled = true; setStatus('전송 중...');
  try {
    await AW.createDoc(C.databaseId, C.surveyCollectionId, {
      pcode: picked.code, store: picked.name, count: list.length,
      items: JSON.stringify(list.map(x => ({ m: x.model, s: x.serial, r: x.serialRaw, k: x.matched ? 1 : 0 })))
    });
    beep(2400); toast(`${list.length}건 전송 완료`);
    setStatus(`${picked.name} · ${list.length}건 전송 완료`);
    list = []; saveDraft(); renderList();
  } catch (e) {
    alert('전송 실패: ' + e.message + '\n(목록은 그대로 남아 있으니 다시 [입력완료]를 누르세요)');
    setStatus('전송 실패');
  } finally { updateSend(); }
};
$('btnClear').onclick = () => {
  if (list.length && !confirm(`인식 결과 ${list.length}건을 모두 지울까요?`)) return;
  list = []; saveDraft(); renderList(); setStatus('');
};

renderList();
loadData();
</script>
</body>
</html>
